<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horta IoT - Umidade do Solo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
      }
  </style>
</head>
<body>
  <main>
    <h1> Monitoramento da Horta</h1>
    <section id="card" class="card sem-dados">
      <div class="valor"><span id="valor">--</span><span id="unidade">%</span></div>
      <div id="status" class="status">Aguardando dados...</div>
      <div class="info">Última atualização: <span id="atualizacao">--</span></div>
      <div id="aviso-desatualizado" class="aviso" hidden>
        Sem dados recentes. O sensor pode estar desligado ou sem conexão.
      </div>
    </section>
    
    <section class="bloco">
      <h2>Histórico</h2>
      <canvas id="grafico" height="120"></canvas>
    </section>

    <section class="bloco">
      <h2>Últimas leituras</h2>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Horário</th><th>Umidade</th><th>Situação</th></tr></thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
